[project]
name = "acme-crewai-tool"
version = "0.1.0"
description = "Reference CrewAI community tool for the Acme sample catalog."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "crewai>=0.80.0",
]

[project.optional-dependencies]
examples = [
  "crewai>=0.80.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
